# ============================================================
#  CareerNexus - Production Application Properties
#  All secrets are read from ENVIRONMENT VARIABLES.
#  Set these in Render → Environment tab. Never hardcode here.
# ============================================================

spring.application.name=CareerNexus

# ── Server ───────────────────────────────────────────────────
# Render injects PORT automatically
server.port=${PORT:8080}

# ── Aiven PostgreSQL ─────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool tuning (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ── JWT Security ─────────────────────────────────────────────
application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ── Supabase (File Storage) ───────────────────────────────────
supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_KEY}
supabase.bucket=${SUPABASE_BUCKET}

# ── Email (SMTP) ─────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.display-name=CareerNexus
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── External APIs ─────────────────────────────────────────────
rapidapi.key=${RAPIDAPI_KEY}
fastapi.extract.url=${FASTAPI_URL:http://localhost:8000/assessment-extract}
frontend.url=${FRONTEND_URL:http://localhost:5173}

# ── File Upload ───────────────────────────────────────────────
file.upload-assessment-files=uploads/assessments/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

